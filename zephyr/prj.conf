# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_CBPRINTF_FP_SUPPORT=y

# RTT (logs over SWD — pas d'UART câblé sur ce montage breadboard)
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_BLOCK=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_RTT_CONSOLE=y

# I2C
CONFIG_I2C=y

# Sensors
CONFIG_SENSOR=y

# ADC
CONFIG_ADC=y

# GPIO
CONFIG_GPIO=y

# BLE
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Myco"

# Zigbee (add-on R23 / ZBOSS)
CONFIG_ZIGBEE_ADD_ON=y
CONFIG_ZIGBEE_APP_UTILS=y
CONFIG_ZIGBEE_ROLE_ROUTER=y

# Selection du protocole au boot : flag persiste en NVS (partition "storage",
# deja presente dans le layout statique de l'add-on Zigbee) + commande shell
# pour le changer + redemarrer. "reboot to apply", comme demande — un futur
# bouton/jumper ou une UI pourront ecrire le meme flag.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_REBOOT=y

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_RTT=y
# Logs et shell ne peuvent pas partager le meme canal RTT (BUILD_ASSERT dans
# shell_rtt.c) — logs restent sur le canal 0 par defaut, shell sur le 1.
CONFIG_SHELL_BACKEND_RTT_BUFFER=1

# Defaut = un seul channel fixe (16) — z2m ne voyait rien car son
# coordinateur est probablement sur un autre channel. Scan de tous les
# channels 802.15.4 (11-26) pendant le steering a la place.
CONFIG_ZIGBEE_CHANNEL_SELECTION_MODE_MULTI=y
CONFIG_ZIGBEE_CHANNEL_MASK=0x7FFF800

CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_THREAD_PRIORITY=7
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# log10f() pour la conversion illuminance ZCL — absent de la libc minimale
CONFIG_FPU=y
CONFIG_PICOLIBC=y
