# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# RTT (logs + shell — pas d'UART câblé sur le fixture de test)
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_BLOCK=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_RTT_CONSOLE=y

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_RTT=y
# Logs et shell ne peuvent pas partager le même canal RTT (BUILD_ASSERT dans
# shell_rtt.c) — logs restent sur le canal 0 par défaut, shell sur le 1.
CONFIG_SHELL_BACKEND_RTT_BUFFER=1

# GPIO — seul périphérique dont ce firmware a besoin
CONFIG_GPIO=y

# NFC : P1.02/P1.03 (module pads 15/16, J1 pins 10/11) sont en mode antenne
# NFC par défaut au reset (datasheet nRF54L15 §8.8.1 — registre PADCONFIG).
# Pas de Kconfig/devicetree pour ça sur cette version de NCS (v3.2.4,
# vérifié : CONFIG_NFCT_PINS_AS_GPIOS et un noeud UICR/nfct n'existent pas
# pour nRF54L ici) — désactivé à la place par un appel HAL direct
# (nrf_nfct_pad_config_enable_set) dans selftest.c au boot.
